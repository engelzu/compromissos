        const checkInterval = setInterval(() => {

                <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z"></path>

          }

          // Check for Export button
          const exportBtn = document.getElementById('btn-export');
          if (exportBtn && !exportBtn.dataset.intercepted) {
            exportBtn.dataset.intercepted = "true";
            
            const newExportBtn = exportBtn.cloneNode(true);
            exportBtn.parentNode.replaceChild(newExportBtn, exportBtn);
            
            newExportBtn.addEventListener('click', async (e) => {

              e.stopPropagation();

      async function exportEntireDatabase(btn) {
        try {
          if (typeof window.XLSX === 'undefined') {
            alert("Erro: Biblioteca SheetJS não carregada. Verifique sua conexão com a internet.");
            return;
          }
          
          const client = supabaseClient.get();
          if (!client) {
            alert("Erro: Supabase não inicializado.");
            return;
          }

          const originalText = btn.textContent;
          btn.textContent = "Exportando...";
          btn.disabled = true;

          let allData = [];
          let page = 0;
          const pageSize = 1000;
          
          while (true) {
            const { data, error } = await client
              .from("compromissos")
              .select("*")
              .order("created_at", { ascending: false })
              .range(page * pageSize, (page + 1) * pageSize - 1);
              
            if (error) throw error;
            if (!data || data.length === 0) break;
            
            allData = allData.concat(data);
            if (data.length < pageSize) break;
            page++;
          }

          function formatDateHelper(dateStr) {
            if (!dateStr) return "";
            const parts = dateStr.split("-");
            return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : dateStr;
          }

          const rows = allData.map(n => ({
            ID: n.id,
            Status: n.status || 'Não Iniciada',
            "Data Registro": formatDateHelper(n.data_registro),
            "Data Prazo": formatDateHelper(n.data_prazo),
            "Nome Reunião": n.nome_reuniao || '',
            Tema: n.tema || '',
            Ação: n.acao || '',
            Responsável: n.responsavel || '',
            Área: n.categoria || '',
            Prioridade: n.prioridade || '',
            Observação: n.observacao || ''
          }));

           const worksheet = window.XLSX.utils.json_to_sheet(rows);
           const workbook = window.XLSX.utils.book_new();
           window.XLSX.utils.book_append_sheet(workbook, worksheet, "Compromissos");
           
           const wbout = window.XLSX.write(workbook, { bookType: 'xlsx', type: 'binary' });
           function s2ab(s) {
             const buf = new ArrayBuffer(s.length);
             const view = new Uint8Array(buf);
             for (let i = 0; i < s.length; i++) view[i] = s.charCodeAt(i) & 0xFF;
             return buf;
           }
           const blob = new Blob([s2ab(wbout)], { type: "application/octet-stream" });
           const url = URL.createObjectURL(blob);
           const a = document.createElement("a");
           a.href = url;
           a.download = `Compromissos_Completo_${new Date().toISOString().split("T")[0]}.xlsx`;
           document.body.appendChild(a);
           a.click();
           setTimeout(() => {
             document.body.removeChild(a);
             window.URL.revokeObjectURL(url);
           }, 0);

          btn.textContent = originalText;
          btn.disabled = false;
        } catch (error) {
          console.error("Erro ao exportar banco de dados:", error);
          alert("Erro ao exportar: " + error.message);
          btn.textContent = "Exportar";
          btn.disabled = false;
        }
      }

        modal.innerHTML = `

        });

        try {
          const client = supabaseClient.get();
          if (!client) throw new Error("Supabase SDK not loaded yet.");
          
          const { data: compromissos, error: errC } = await client.from("compromissos").select("*");
          const { data: areas, error: errA } = await client.from("areas").select("*");
          const { data: responsaveis, error: errR } = await client.from("responsaveis").select("*").order("name");
          const { data: reunioes, error: errM } = await client.from("reunioes").select("*").order("name");

          if (errC) throw errC;

          const contentDiv = document.getElementById('dash-modal-content');
          contentDiv.style.padding = '0';

      function renderDashboardContent(container, data, areas, responsaveis, reunioes) {
        const areaOptions = areas.map(a => `<option value="${a.name}">${a.name}</option>`).join('');
        const respOptions = responsaveis.map(r => `<option value="${r.name}">${r.name}</option>`).join('');
        const meetOptions = reunioes.map(m => `<option value="${m.name}">${m.name}</option>`).join('');
        
        container.innerHTML = `
          <div class="dash-filters" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; align-items: end; background-color: #f9fafb; padding: 20px; border-radius: 12px; border: 1px solid #f3f4f6; font-family: ui-sans-serif, system-ui, sans-serif;">
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <label for="dash-area-filter" style="font-weight: 600; font-size: 13px; color: #4b5563;">Área</label>
              <select id="dash-area-filter" class="dash-select" style="width: 100%; box-sizing: border-box;">
                <option value="TODOS">Todas as Áreas</option>
                ${areaOptions}
              </select>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <label for="dash-resp-filter" style="font-weight: 600; font-size: 13px; color: #4b5563;">Responsável</label>
              <select id="dash-resp-filter" class="dash-select" style="width: 100%; box-sizing: border-box;">
                <option value="TODOS">Todos os Responsáveis</option>
                ${respOptions}
              </select>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <label for="dash-meet-filter" style="font-weight: 600; font-size: 13px; color: #4b5563;">Tipo de Reunião</label>
              <select id="dash-meet-filter" class="dash-select" style="width: 100%; box-sizing: border-box;">
                <option value="TODOS">Todos os Tipos de Reunião</option>
                ${meetOptions}
              </select>
            </div>
          </div>

          <div class="dash-stats-grid">
            <div class="dash-stat-card total">
              <span class="dash-stat-title">Total</span>
              <span class="dash-stat-value" id="stat-total">0</span>
            </div>
            <div class="dash-stat-card done">
              <span class="dash-stat-title">Concluídas</span>
              <span class="dash-stat-value" id="stat-done">0</span>
            </div>
            <div class="dash-stat-card doing">
              <span class="dash-stat-title">Em Andamento</span>
              <span class="dash-stat-value" id="stat-doing">0</span>
            </div>
            <div class="dash-stat-card todo">
              <span class="dash-stat-title">Não Iniciadas</span>
              <span class="dash-stat-value" id="stat-todo">0</span>
            </div>
            <div class="dash-stat-card overdue">
              <span class="dash-stat-title">Atrasadas</span>
              <span class="dash-stat-value" id="stat-overdue">0</span>
            </div>
          </div>

          <div class="dash-sections-grid">
            <div class="dash-section-card">
              <h3 class="dash-section-title">Quantidade por Responsável</h3>
              <div class="dash-list" id="dash-responsibles-list"></div>
            </div>
            <div class="dash-section-card">
              <h3 class="dash-section-title">Quantidade por Reunião</h3>
              <div class="dash-list" id="dash-meetings-list"></div>
            </div>
          </div>
        `;

        const areaFilter = document.getElementById('dash-area-filter');
        const respFilter = document.getElementById('dash-resp-filter');
        const meetFilter = document.getElementById('dash-meet-filter');
        
        function updateStats() {
          const selectedArea = areaFilter.value;
          const selectedResp = respFilter.value;
          const selectedMeet = meetFilter.value;
          
          let filtered = data;
          if (selectedArea !== 'TODOS') {
            filtered = filtered.filter(c => c.categoria === selectedArea);
          }
          if (selectedResp !== 'TODOS') {
            filtered = filtered.filter(c => c.responsavel === selectedResp);
          }
          if (selectedMeet !== 'TODOS') {
            filtered = filtered.filter(c => c.nome_reuniao === selectedMeet);
          }
            
          const total = filtered.length;
          
          const done = filtered.filter(c => c.status === 'Concluída').length;
          const doing = filtered.filter(c => c.status === 'Em Andamento').length;
          const todo = filtered.filter(c => c.status === 'Não Iniciada').length;
          
          const todayStr = new Date().toISOString().split('T')[0];
          const overdue = filtered.filter(c => {
            if (c.status === 'Concluída') return false;
            if (!c.data_prazo) return false;
            return c.data_prazo < todayStr;
          }).length;

          document.getElementById('stat-total').textContent = total;
          document.getElementById('stat-done').textContent = done;
          document.getElementById('stat-doing').textContent = doing;
          document.getElementById('stat-todo').textContent = todo;
          document.getElementById('stat-overdue').textContent = overdue;

          // Responsibles Breakdown
          const respMap = {};
          filtered.forEach(c => {
            const r = c.responsavel || 'Não Definido';
            respMap[r] = (respMap[r] || 0) + 1;
          });
          const sortedResp = Object.entries(respMap).sort((a, b) => b[1] - a[1]);
          const maxRespCount = sortedResp.length > 0 ? sortedResp[0][1] : 1;
          
          const respListDiv = document.getElementById('dash-responsibles-list');
          if (sortedResp.length === 0) {
            respListDiv.innerHTML = '<p style="font-size: 13px; color: #9ca3af; text-align: center; margin-top: 20px;">Nenhum registro encontrado</p>';
          } else {
            respListDiv.innerHTML = sortedResp.map(([name, count]) => {
              const pct = (count / maxRespCount) * 100;
              return `
                <div class="dash-list-item">
                  <div class="dash-item-info">
                    <span class="dash-item-name">${name}</span>
                    <span class="dash-item-count">${count}</span>
                  </div>
                  <div class="dash-progress-bg">
                    <div class="dash-progress-bar" style="width: ${pct}%; background-color: #10b981;"></div>
                  </div>
                </div>
              `;
            }).join('');
          }

          // Meetings Breakdown
          const meetMap = {};
          filtered.forEach(c => {
            const m = c.nome_reuniao || 'Sem Reunião';
            meetMap[m] = (meetMap[m] || 0) + 1;
          });
          const sortedMeet = Object.entries(meetMap).sort((a, b) => b[1] - a[1]);
          const maxMeetCount = sortedMeet.length > 0 ? sortedMeet[0][1] : 1;

          const meetListDiv = document.getElementById('dash-meetings-list');
          if (sortedMeet.length === 0) {
            meetListDiv.innerHTML = '<p style="font-size: 13px; color: #9ca3af; text-align: center; margin-top: 20px;">Nenhum registro encontrado</p>';
          } else {
            meetListDiv.innerHTML = sortedMeet.map(([name, count]) => {
              const pct = (count / maxMeetCount) * 100;
              return `
                <div class="dash-list-item">
                  <div class="dash-item-info">
                    <span class="dash-item-name">${name}</span>
                    <span class="dash-item-count">${count}</span>
                  </div>
                  <div class="dash-progress-bg">
                    <div class="dash-progress-bar" style="width: ${pct}%; background-color: #3b82f6;"></div>
                  </div>
                </div>
              `;
            }).join('');
          }
        }

        areaFilter.addEventListener('change', updateStats);
        respFilter.addEventListener('change', updateStats);
        meetFilter.addEventListener('change', updateStats);
        updateStats();
      }
